<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phat Lab admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Startside: to store valg, booking (oransje) og produksjon (magenta), med et lite levende tall på hvert kort. */
:root{
  --bg:#0A0A0F; --card:#15121F; --ink:#F5F3FF; --muted:#8B7FB8; --line:#2D2640;
  --orange:#E8682A; --grad:linear-gradient(135deg,#D946EF 0%,#7C3AED 100%);
  --grad-hot:linear-gradient(135deg,#F97316 0%,#EC4899 100%);
  --f-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60rem 30rem at 85% -10%,rgba(124,58,237,.18),transparent 60%),radial-gradient(50rem 25rem at -10% 110%,rgba(249,115,22,.12),transparent 60%)}
main{min-height:100%;max-width:980px;margin:0 auto;padding:48px clamp(16px,4vw,32px);display:flex;flex-direction:column;justify-content:center;gap:36px}
.brand{display:flex;flex-direction:column;gap:10px}
.logo{font:700 15px var(--f-display);letter-spacing:.06em}
.logo span{background:var(--grad-hot);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font:700 clamp(32px,5vw,52px)/1.05 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px 26px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s ease,border-color .15s ease}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--bar)}
.card:hover{transform:translateY(-3px);border-color:var(--hl)}
.card:focus-visible{outline:2px solid var(--hl);outline-offset:3px}
.card.book{--bar:#7C3AED;--hl:#A78BFA}
.card.prod{--bar:var(--grad);--hl:#D946EF}
.card.review{--bar:var(--grad-hot);--hl:#EC4899}
.card.admin{--bar:linear-gradient(135deg,#8B7FB8,#5B5280);--hl:#A99FD6}
.card.money{--bar:linear-gradient(135deg,#3DDC97,#22D3EE);--hl:#3DDC97}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--hl) 16%,transparent);color:var(--hl)}
.ico svg{width:24px;height:24px}
.card h2{font:700 24px/1.15 var(--f-display);margin:0}
.card p{margin:0;color:var(--muted);font-size:15px}
.live{display:flex;gap:18px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
.live div{display:flex;flex-direction:column}
.live b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.live span{font-size:12px;color:var(--muted);margin-top:4px}
.go{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.go i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bar);color:#fff;transition:transform .15s ease}
.card:hover .go i{transform:translateX(3px)}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){.card,.go i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo"><a href="../" style="color:inherit;text-decoration:none">PHAT <span>LAB</span></a> <span style="color:var(--muted);font-weight:500">/ Admin</span></div>
    <h1>Phat Lab <em>admin</em></h1>
    <div class="date">Interne verktøy. Hver del har sin egen PIN-kode.</div>
  </div>

  <div class="cards">
    <a class="card money" href="okonomi.html">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg></div>
      <h2>Økonomi</h2>
      <p>Innkommende betalinger, faste inntekter og hva som er forfalt – med prognose for de neste månedene.</p>
      <div class="go" style="margin-top:auto">Åpne økonomi <i aria-hidden="true">&#8594;</i></div>
    </a>
  </div>

  <footer><a href="../" style="color:inherit">← Til startsiden</a></footer>
</main>
</body>
</html>
